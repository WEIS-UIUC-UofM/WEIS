constraints:
  control:
    Max_PtfmPitch:
      flag: true
      max: 6.757845
    Std_PtfmPitch:
      flag: true
      max: 2.0
    nacelle_acceleration:
      flag: true
      max: 3.2667
  tower:
    frequency_1:
      flag: true
      lower_bound: 0.35
      upper_bound: 0.51
    height_constraint:
      flag: false
      lower_bound: 0.1
      upper_bound: 5.0
    slope:
      flag: false
design_variables:
  control:
    ps_percent:
      flag: false
      lower_bound: 0.75
      upper_bound: 1.0
    servo:
      pitch_control:
        Kp_float:
          flag: true
          max: 0.0
          min: -20.0
        omega:
          flag: true
          max: 0.7
          min: 0.1
        ptfm_freq:
          flag: true
          max: 1.5
          min: 0.1
        zeta:
          flag: true
          max: 1.5
          min: 0.7
      torque_control:
        omega:
          flag: false
          max: 0.7
          min: 0.1
        zeta:
          flag: false
          max: 1.5
          min: 0.7
  floating:
    joints:
      flag: false
      r_coordinate:
      - lower_bound: 41.57
        names:
        - col1_keel
        - col1_freeboard
        - col2_keel
        - col2_freeboard
        - col3_keel
        - col3_freeboard
        upper_bound: 61.57
      z_coordinate:
      - lower_bound: -24.0
        names:
        - main_keel
        - col1_keel
        - col2_keel
        - col3_keel
        upper_bound: -16.0
      - lower_bound: 7.0
        names:
        - main_freeboard
        - col1_freeboard
        - col2_freeboard
        - col3_freeboard
        upper_bound: 21.0
    members:
      flag: false
      groups:
      - diameter:
          constant: true
          lower_bound: 6.0
          upper_bound: 14.0
        names:
        - main_column
      - diameter:
          constant: true
          lower_bound: 10.5
          upper_bound: 14.5
        names:
        - column1
        - column2
        - column3
      - diameter:
          constant: true
          lower_bound: 0.71
          upper_bound: 1.11
        names:
        - Y_pontoon_upper1
        - Y_pontoon_upper2
        - Y_pontoon_upper3
      - diameter:
          constant: true
          lower_bound: 6.6148
          upper_bound: 13.6148
        names:
        - Y_pontoon_lower1
        - Y_pontoon_lower2
        - Y_pontoon_lower3
  rotor_diameter:
    flag: true
    maximum: 250.0
    minimum: 235.0
  tower:
    outer_diameter:
      flag: false
      lower_bound: 6.0
      upper_bound: 7.0
    section_height:
      flag: false
      lower_bound: 13.0
      upper_bound: 18.0
driver:
  design_of_experiments:
    flag: false
    generator: LatinHypercube
    levels: 1
    num_samples: 50
    run_parallel: true
    seed: 2
    skip_if_results_exist: true
    train_surrogate_model: true
  optimization:
    flag: false
    max_iter: 300
    solver: COBYLA
    tol: 0.001
  surrogate_based_optimization:
    flag: false
    max_function_calls: 300000
    max_iter: 300
    solver: COBYLA
general:
  fname_output: refturb_output
  folder_output: outputs/level1_doe
merit_figure: platform_mass
recorder:
  file_name: log_opt.sql
  flag: false
  includes:
  - '*'
